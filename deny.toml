[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "CC0-1.0",
  "MIT",
  "MITNFA",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # libFuzzer's upstream LLVM/NCSA terms are fuzz-tooling only. Keep NCSA scoped
  # to this exact crate/version rather than allowing it across the dependency graph.
  { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
