name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  # `audit` is a required branch-protection check, so every PR must create it.
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit RustSec advisories
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses, bans, advisories, and sources
        run: cargo deny check
