name: Fuzz

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "fuzz/**"
      - "src/descriptor.rs"
      - "src/fingerprint.rs"
      - "src/wallet.rs"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surfaces:
    name: Public descriptor and watch-only surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-08-12

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify committed fuzz lockfile
        run: >-
          cargo +nightly-2026-08-12 metadata
          --manifest-path fuzz/Cargo.toml
          --locked
          --format-version 1
          >/dev/null

      - name: Fuzz public surfaces
        run: >-
          cargo +nightly-2026-08-12 fuzz run public_surfaces
          fuzz/corpus/public_surfaces
          -- -max_total_time=${{ github.event_name == 'schedule' && '300' || '30' }}
          -timeout=5
          -max_len=65536

      - name: Require stable fuzz lockfile
        run: git diff --exit-code -- fuzz/Cargo.lock
